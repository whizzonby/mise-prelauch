          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/FavoriteList" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [me]
      operationId: addFavorite
      description: "Idempotent: 201 when saved, 200 when it already was. Unpublished meals answer 404."
      security: [{ customerSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FavoriteInput" }
      responses:
        "201":
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: object, required: [meal_id, saved], properties: { meal_id: { type: string, format: uuid }, saved: { type: boolean } } }
                  meta: { $ref: "#/components/schemas/Meta" }
        "200":
          description: Already saved.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: object, required: [meal_id, saved], properties: { meal_id: { type: string, format: uuid }, saved: { type: boolean } } }
                  meta: { $ref: "#/components/schemas/Meta" }
