openapi: 3.1.0
info:
  title: Mise API
  version: 1.9.0
  summary: The REST API behind the Mise marketing site, customer app and admin console.
  description: |
    Conventions (envelope, errors, pagination, rate limits, idempotency, versioning)
    are in docs/api/API_STANDARDS.md. This file is the contract: the server's test
    suite fails if a route is served but not described here, or described but not
    served (internal/server/identity_test.go, TestRoutesMatchOpenAPI), and the
    TypeScript types in packages/api-client are generated from it.

    Authentication is an opaque bearer token in `Authorization: Bearer <token>`.
    Browsers never hold one: each Next.js app keeps it in an httpOnly cookie on its
    own server (docs/security/AUTHENTICATION.md). Three token kinds exist and are
    never interchangeable: lead profile tokens (waitlist), customer sessions and
    admin sessions.
servers:
  - url: http://localhost:8090
    description: Local development

tags:
  - name: health
  - name: leads
    description: The pre-launch waitlist.
  - name: referrals
  - name: events
    description: First-party analytics.
  - name: auth
    description: Customer accounts.
  - name: me
    description: The signed-in customer.
  - name: admin-auth
    description: Staff sign-in, MFA.
  - name: admin
    description: Back-office lead management.
  - name: catalog
    description: The public meal catalogue (Sprint 2).
  - name: admin-catalog
    description: Catalogue management for staff (Sprint 2).

  - name: plans
    description: Subscription plans and their prices (Sprint 3).
  - name: menus
    description: Published weekly menus (Sprint 3).
  - name: subscriptions
    description: The customer's subscription (Sprint 3).
  - name: selections
    description: Choosing meals for a week (Sprint 3).
  - name: orders
    description: Orders made at each cutoff (Sprint 3).
  - name: billing
    description: Checkout, billing history and invoices (Sprint 3).
  - name: payments
    description: Payment provider webhooks (Sprint 3).
  - name: test-payments
    description: The test payment simulator. Never served in production.
  - name: admin-commerce
    description: Restricted commerce administration (Sprint 3).
  - name: admin-overview
    description: Operational overview and reports (Sprint 4).
  - name: admin-customers
    description: Customer list and Customer 360 (Sprint 4).
  - name: admin-crm
    description: Lead stages, notes, segments, campaigns, referrals and retention (Sprint 4).
  - name: admin-support
    description: Internal support cases (Sprint 4).
  - name: admin-staff
    description: Staff accounts, invitations and roles (Sprint 4).
  - name: admin-system
    description: Exports, alerts, settings, integrations and the audit log (Sprint 4).
  - name: admin-culinary
    description: Ingredients, units, chefs, recipes, versions, reviews and costing (Sprint 5).
  - name: admin-production
    description: Demand snapshots, production plans, requirements, batches, tasks, quality, packaging, waste and reports (Sprint 5).
  - name: admin-suppliers
    description: Suppliers, farmers, qualification, products, prices and availability (Sprint 6).
  - name: admin-procurement
    description: Procurement planning, quotations and purchase orders (Sprint 6).
  - name: admin-inventory
    description: Receiving, lots, the stock ledger, reservations, issues, counts and traceability (Sprint 6).
  - name: admin-fulfillment
    description: "Fulfillment: obligations from production readiness, kit verification, release (Sprint 7)."
  - name: admin-delivery
    description: "Delivery: zones, calendar, capacity, partners, dispatch, custody, tracking, proof, exceptions, reconciliation (Sprint 7)."
  - name: customer-delivery
    description: A customer's own delivery status, support and reschedule requests (Sprint 7).
  - name: admin-analytics
    description: "Analytics: metric catalogue, dashboards, snapshots, data quality and exports (Sprint 8)."
  - name: admin-automation
    description: "Automation: typed rules, executions, approvals and tasks (Sprint 8). Never financial or operational actions."
  - name: admin-reports
    description: "Scheduled reports: generated once per period, recorded email outcomes (Sprint 8)."
  - name: admin-forecasting
    description: "Forecasting: readiness, baseline models, backtests and versioned runs (Sprint 8). Advisory only."
  - name: admin-launch
    description: "Launch readiness (Sprint 9): system status, evidence-backed launch gates and append-only sign-offs."
  - name: chat
    description: Mise Chat for signed-in customers (Sprint 9.1).
  - name: chat-guest
    description: Mise Chat for guests (name, email and an opaque token).
  - name: help
    description: The public help centre (published articles only).
  - name: admin-chat
    description: The support inbox, saved replies and chat settings.
  - name: admin-help
    description: Writing, reviewing and publishing help articles.
  - name: admin-finance
    description: "Management finance (Sprint 9.2): expenses, recurring costs, coverage, cash balances, the management summary."
  - name: behavior
    description: "Customer-app behaviour events (Sprint 9.2)."
  - name: admin-intelligence
    description: "Mise Intelligence (Sprint 9.2): admin-only executive intelligence."
paths:
  /api/v1/health:
    get:
      tags: [health]
      operationId: health
      summary: Liveness. Does not touch the database.
      responses:
        "200":
          description: The process is serving.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusEnvelope" }

  /api/v1/ready:
    get:
      tags: [health]
      operationId: ready
      summary: Readiness. Pings PostgreSQL with a 2-second timeout.
      responses:
        "200":
          description: Ready to serve traffic.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusEnvelope" }
        "503": { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------ leads

  /api/v1/leads:
    post:
      tags: [leads]
      operationId: createLead
      summary: Join the waitlist.
      description: Idempotent on the email address. An address already on the list gets 200 and an email, never a second lead.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLeadInput" }
      responses:
        "201":
          description: A new lead.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/CreateLeadResult" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "200":
          description: The address was already on the list.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/CreateLeadResult" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /api/v1/leads/verify:
    post:
      tags: [leads]
      operationId: verifyLead
      summary: Confirm a lead's email from the emailed link.
      requestBody: { $ref: "#/components/requestBodies/Token" }
      responses:
        "200":
          description: Verified.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [lead, profile_token]
                    properties:
                      lead: { $ref: "#/components/schemas/LeadSummary" }
                      profile_token: { type: string }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }

  /api/v1/leads/unsubscribe:
    post:
      tags: [leads]
      operationId: unsubscribeLead
      requestBody: { $ref: "#/components/requestBodies/Token" }
      responses:
        "200": { $ref: "#/components/responses/Done" }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/leads/me:
    get:
      tags: [leads]
      operationId: getLeadSummary
      summary: The waitlist page for the lead holding a profile token.
      security: [{ leadProfileToken: [] }]
      responses:
        "200":
          description: The lead's own summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadSummaryEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/v1/leads/preferences:
    patch:
      tags: [leads]
      operationId: updateLeadPreferences
      security: [{ leadProfileToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PreferencesInput" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadSummaryEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/referrals/{code}:
    get:
      tags: [referrals]
      operationId: lookupReferral
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, maxLength: 32 } }
      responses:
        "200":
          description: The inviting lead's first name.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [code, referrer_first_name]
                    properties:
                      code: { type: string }
                      referrer_first_name: { type: string }
                  meta: { $ref: "#/components/schemas/Meta" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/events:
    post:
      tags: [events]
      operationId: sendEvents
      summary: Record allow-listed first-party analytics events.
      security: [{}, { leadProfileToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventBatch" }
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [accepted]
                    properties:
                      accepted: { type: integer }
                  meta: { $ref: "#/components/schemas/Meta" }
        "422": { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------ customer accounts

  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create a customer account.
      description: |
        Always answers 202 `check_email` for a valid request, whether or not the
        address already has an account (that person is emailed instead). 403
        `registration_closed` while CUSTOMER_REGISTRATION_ENABLED is off.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterInput" }
      responses:
        "202": { $ref: "#/components/responses/CheckEmail" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /api/v1/auth/verify-email:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Confirm an account's email from the emailed link (single use, 48 hours).
      description: For customers this also links the account to the waitlist lead with the same address, if there is one.
      requestBody: { $ref: "#/components/requestBodies/Token" }
      responses:
        "200": { $ref: "#/components/responses/Done" }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Customer sign-in.
      requestBody: { $ref: "#/components/requestBodies/Credentials" }
      responses:
        "200":
          description: A customer session.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [token, expires_in, user]
                    properties:
                      token: { type: string, description: "Opaque session token. Keep it server-side." }
                      expires_in: { type: integer, description: "Seconds until the session's absolute end." }
                      user: { $ref: "#/components/schemas/Customer" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: "`email_not_verified`: a new verification link has been sent."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429": { $ref: "#/components/responses/Error" }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      security: [{ customerSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/Done" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/auth/password/forgot:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Email a password reset link to a customer.
      description: Always 202. Staff accounts are not reset by email (see AUTHENTICATION.md).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
      responses:
        "202": { $ref: "#/components/responses/CheckEmail" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Set a new password from a reset link (single use, 1 hour). Ends every session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              additionalProperties: false
              properties:
                token: { type: string }
                password: { type: string, minLength: 12 }
      responses:
        "200": { $ref: "#/components/responses/Done" }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/me:
    get:
      tags: [me]
      operationId: getMe
      security: [{ customerSession: [] }]
      responses:
        "200":
          description: The signed-in customer.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Customer" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/me/sessions:
    get:
      tags: [me]
      operationId: listMySessions
      security: [{ customerSession: [] }]
      responses:
        "200":
          description: Live sessions, most recently used first.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/SessionInfo" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      tags: [me]
      operationId: revokeOtherSessions
      summary: Sign out everywhere except this session.
      security: [{ customerSession: [] }]
      responses:
        "200":
          description: Number of sessions ended.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [revoked]
                    properties:
                      revoked: { type: integer }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/me/sessions/{id}:
    delete:
      tags: [me]
      operationId: revokeSession
      security: [{ customerSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/Done" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------ admin sign-in

  /api/v1/admin/auth/login:
    post:
      tags: [admin-auth]
      operationId: adminLogin
      summary: Staff sign-in with a password; the first of up to two steps.
      description: |
        When `mfa` is `challenge` or `enrolment_required`, the session lasts 10 minutes
        and may call only `me`, `logout` and the `mfa/*` endpoints until a code is
        presented. Other endpoints answer 403 `mfa_required`.
      requestBody: { $ref: "#/components/requestBodies/Credentials" }
      responses:
        "200": { $ref: "#/components/responses/AdminGrant" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /api/v1/admin/auth/logout:
    post:
      tags: [admin-auth]
      operationId: adminLogout
      security: [{ adminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/Done" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/admin/auth/me:
    get:
      tags: [admin-auth]
      operationId: adminMe
      security: [{ adminSession: [] }]
      responses:
        "200":
          description: The signed-in staff member, including sessions still finishing MFA.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/AdminPrincipal" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/admin/auth/mfa/verify:
    post:
      tags: [admin-auth]
      operationId: adminMfaVerify
      summary: Present a TOTP code. Replaces the session token.
      description: Five wrong codes end the session (`mfa_locked`). A code is accepted once.
      security: [{ adminSession: [] }]
      requestBody: { $ref: "#/components/requestBodies/Code" }
      responses:
        "200": { $ref: "#/components/responses/AdminGrant" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/admin/auth/mfa/setup:
    post:
      tags: [admin-auth]
      operationId: adminMfaSetup
      summary: Start (or restart) adding Mise to an authenticator app.
      security: [{ adminSession: [] }]
      responses:
        "200":
          description: The secret, as text, an otpauth URL and a QR code.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [secret, otpauth_url, qr_png_base64]
                    properties:
                      secret: { type: string }
                      otpauth_url: { type: string }
                      qr_png_base64: { type: string }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/admin/auth/mfa/confirm:
    post:
      tags: [admin-auth]
      operationId: adminMfaConfirm
      summary: Confirm enrolment with the first code. Turns MFA on and completes the session.
      security: [{ adminSession: [] }]
      requestBody: { $ref: "#/components/requestBodies/Code" }
      responses:
        "200": { $ref: "#/components/responses/AdminGrant" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------ admin

  /api/v1/admin/stats/overview:
    get:
      tags: [admin]
      operationId: adminOverview
      description: "Permission: `analytics.view`."
      security: [{ adminSession: [] }]
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 7, maximum: 180, default: 30 } }
      responses:
        "200":
          description: Dashboard figures.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Overview" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/v1/admin/leads:
    get:
      tags: [admin]
      operationId: adminListLeads
      description: "Permission: `leads.read`. Offset pagination (API_STANDARDS.md)."
      security: [{ adminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/LeadQuery"
        - $ref: "#/components/parameters/LeadStatus"
        - $ref: "#/components/parameters/LeadLocation"
        - $ref: "#/components/parameters/LeadSource"
        - $ref: "#/components/parameters/LeadReferral"
        - $ref: "#/components/parameters/LeadPackaging"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - { name: stage, in: query, schema: { type: string, enum: [new, contacted, qualified, unqualified, converted, unsubscribed] } }
        - { name: assigned_to, in: query, description: "A staff user id, or none.", schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: One page of leads, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/LeadPage" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/admin/leads/export.csv:
    get:
      tags: [admin]
      operationId: adminExportLeads
      description: "Permission: `leads.export`. Audited before any row is sent. At most 50,000 rows."
      security: [{ adminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/LeadQuery"
        - $ref: "#/components/parameters/LeadStatus"
        - $ref: "#/components/parameters/LeadLocation"
        - $ref: "#/components/parameters/LeadSource"
        - $ref: "#/components/parameters/LeadReferral"
        - $ref: "#/components/parameters/LeadPackaging"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: CSV, one lead per row; cells starting with = + - @ are prefixed with '.
          content:
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/v1/admin/leads/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [admin]
      operationId: adminGetLead
      description: "Permission: `leads.read`."
      security: [{ adminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/LeadDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [admin]
      operationId: adminSetLeadStatus
      description: "Permission: `leads.update`. Audited."
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status: { type: string, enum: [VERIFIED, QUALIFIED, UNSUBSCRIBED, BLOCKED] }
      responses:
        "200": { $ref: "#/components/responses/LeadDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      operationId: adminEraseLead
      description: "Permission: `leads.erase`. Permanent; leaves one audit entry with no personal data. A linked customer account is kept and unlinked."
      security: [{ adminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/Done" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------ Sprint 2: account settings

  /api/v1/me/password:
    put:
      tags: [me]
      operationId: changePassword
      summary: Change the password (signed in). Other sessions end; a notice is emailed.
      description: "Rate-limited per address and per account."
      security: [{ customerSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordInput" }
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
