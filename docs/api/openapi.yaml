      in: header
      name: X-Guest-Token
      description: Opaque guest chat token, held by the app server in an httpOnly cookie (never by browser script).
    leadProfileToken:
      type: http
      scheme: bearer
      description: Stateless signed token for one waitlist lead (decisions/prelaunch/009).
    customerSession:
      type: http
      scheme: bearer
      description: Customer session token, held by the customer Next.js server.
    adminSession:
      type: http
      scheme: bearer
      description: Admin session token, held by the admin Next.js server.

  parameters:
    LeadQuery: { name: q, in: query, description: "Name or email contains", schema: { type: string, maxLength: 100 } }
    LeadStatus: { name: status, in: query, schema: { $ref: "#/components/schemas/LeadStatus" } }
    LeadLocation: { name: location, in: query, schema: { type: string } }
    LeadSource: { name: source, in: query, description: "First-touch utm_source, 'referral' or 'direct'", schema: { type: string } }
    LeadReferral: { name: referral, in: query, schema: { type: string, enum: [referrer, referred] } }
    LeadPackaging: { name: packaging, in: query, description: "A packaging option value, or 'none'", schema: { type: string } }
    From: { name: from, in: query, schema: { type: string, format: date } }
    To: { name: to, in: query, description: "Inclusive", schema: { type: string, format: date } }

  requestBodies:
    Token:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token]
            additionalProperties: false
            properties:
              token: { type: string }
    Credentials:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            additionalProperties: false
            properties:
              email: { type: string }
              password: { type: string }
    Code:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [code]
            additionalProperties: false
            properties:
              code: { type: string, pattern: "^[0-9]{6}$" }

  responses:
    Error:
      description: An error envelope. See API_STANDARDS.md for codes.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Done:
      description: "Done. The body is a small object such as {\"verified\": true}."
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                type: object
                additionalProperties: { type: boolean }
              meta: { $ref: "#/components/schemas/Meta" }
    CheckEmail:
      description: Accepted. Nothing in the answer reveals whether an account exists.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [check_email] }
              meta: { $ref: "#/components/schemas/Meta" }
    AdminGrant:
      description: An admin session, complete or waiting for its second factor.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                type: object
                required: [token, expires_in, admin, mfa]
                properties:
                  token: { type: string }
                  expires_in: { type: integer }
                  admin: { $ref: "#/components/schemas/AdminPrincipal" }
                  mfa: { $ref: "#/components/schemas/MFAState" }
              meta: { $ref: "#/components/schemas/Meta" }
    LeadDetail:
      description: Everything about one lead.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: { $ref: "#/components/schemas/LeadDetail" }
              meta: { $ref: "#/components/schemas/Meta" }

  schemas:
    BuildVersion:
      type: object
      required: [version, commit]
      properties:
        version: { type: string }
        commit: { type: string }
    SystemStatus:
      type: object
      required: [api, environment, database_ms, workers, worker_healthy, jobs, failed_jobs_24h, email_failures_24h, consumers, latest_event_id, payment_webhook_failures, payment_webhooks_pending, checked_at]
      properties:
        api: { $ref: "#/components/schemas/BuildVersion" }
        environment: { type: string }
        database_ms: { type: number }
        workers:
          type: array
          items:
            type: object
            required: [worker, version, started_at, beat_at, stale]
            properties:
              worker: { type: string }
              version: { type: string }
              started_at: { type: string, format: date-time }
              beat_at: { type: string, format: date-time }
              stale: { type: boolean }
        worker_healthy: { type: boolean }
        jobs:
          type: array
          items:
            type: object
            required: [kind, waiting, failed_24h, oldest_waiting]
            properties:
              kind: { type: string }
              waiting: { type: integer }
              failed_24h: { type: integer }
              oldest_waiting: { type: [string, "null"], format: date-time }
        failed_jobs_24h: { type: integer }
        email_failures_24h: { type: integer }
        consumers:
          type: array
          items:
            type: object
            required: [consumer, last_event_id, lag, updated_at]
            properties:
              consumer: { type: string }
              last_event_id: { type: integer }
              lag: { type: integer, description: "Events after the offset (an upper bound: a consumer routes only some types)." }
              updated_at: { type: string, format: date-time }
        latest_event_id: { type: integer }
        payment_webhook_failures: { type: integer }
        payment_webhooks_pending: { type: integer }
        checked_at: { type: string, format: date-time }
    LaunchSignoff:
      type: object
      required: [id, decision, reference, note, by, at]
      properties:
        id: { type: integer }
        decision: { type: string, enum: [approved, not_applicable] }
        reference: { type: string }
        note: { type: string }
        by: { type: string }
        at: { type: string, format: date-time }
    LaunchGate:
      type: object
      required: [key, name, category, owner, critical, evidence, evidence_ok, signoff, status]
      properties:
        key: { type: string }
        name: { type: string }
        category: { type: string, enum: [business, commercial, operations, content, engineering, security, infrastructure] }
        owner: { type: string }
        critical: { type: boolean }
        evidence: { type: [string, "null"], description: "What the system observed; null when the gate cannot be observed." }
        evidence_ok: { type: [boolean, "null"] }
        signoff:
          oneOf:
            - { $ref: "#/components/schemas/LaunchSignoff" }
            - { type: "null" }
        status: { type: string, enum: [verified, configured, blocked, not_applicable] }
    LaunchOverview:
      type: object
      required: [ready, summary, critical_blockers, gates, checked_at]
      properties:
        ready: { type: boolean }
        summary: { type: string }
        critical_blockers: { type: integer }
        gates: { type: array, items: { $ref: "#/components/schemas/LaunchGate" } }
        checked_at: { type: string, format: date-time }
    LaunchSignoffInput:
      type: object
      additionalProperties: false
      required: [decision, reference]
      properties:
        decision: { type: string, enum: [approved, not_applicable, revoked] }
        reference: { type: string, minLength: 3, maxLength: 300 }
        note: { type: string, maxLength: 2000 }
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id: { type: string }
    StatusEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status: { type: string }
        meta: { $ref: "#/components/schemas/Meta" }
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string, description: "Stable, for programs." }
        message: { type: string, description: "For people; may change." }
        fields:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
    ErrorEnvelope:
      type: object
      required: [error, meta]
      properties:
        error: { $ref: "#/components/schemas/ApiError" }
        meta: { $ref: "#/components/schemas/Meta" }

    # ---- leads
    LeadStatus:
      type: string
      enum: [PENDING, VERIFIED, QUALIFIED, CONVERTED, UNSUBSCRIBED, BLOCKED]
    ReferralCounts:
      type: object
      required: [pending, converted]
      properties:
        pending: { type: integer }
        converted: { type: integer }
    LeadSummary:
      type: object
      required: [first_name, status, verification_required, referral_code, referral_url, referrals, profile_completed]
      properties:
        first_name: { type: string }
        status: { $ref: "#/components/schemas/LeadStatus" }
        verification_required: { type: boolean }
        referral_code: { type: string }
        referral_url: { type: string }
        referrals: { $ref: "#/components/schemas/ReferralCounts" }
        profile_completed: { type: boolean }
    LeadSummaryEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/LeadSummary" }
        meta: { $ref: "#/components/schemas/Meta" }
    AttributionTouch:
      type: object
      properties:
        utm_source: { type: string }
        utm_medium: { type: string }
        utm_campaign: { type: string }
        utm_content: { type: string }
        utm_term: { type: string }
        landing_page: { type: string }
        referrer_url: { type: string }
    CreateLeadInput:
      type: object
      required: [first_name, last_name, email, location, dietary_interests, consent, website, elapsed_ms]
      additionalProperties: false
      properties:
        first_name: { type: string, maxLength: 80 }
        last_name: { type: string, maxLength: 80 }
        email: { type: string, maxLength: 254 }
        phone: { type: string }
        location: { type: string }
        dietary_interests: { type: array, items: { type: string } }
        household_size: { type: integer, minimum: 1, maximum: 12 }
        packaging_preference: { type: string }
        consent: { type: boolean }
        referral_code: { type: string }
        attribution:
          type: object
          properties:
            first: { $ref: "#/components/schemas/AttributionTouch" }
            latest: { $ref: "#/components/schemas/AttributionTouch" }
        anonymous_id: { type: string }
        website: { type: string, description: "Honeypot. Always empty from a person." }
        elapsed_ms: { type: integer, description: "Milliseconds the form was open." }
    CreateLeadResult:
      type: object
      required: [outcome]
      properties:
        outcome: { type: string, enum: [created, already_on_list] }
        lead: { $ref: "#/components/schemas/LeadSummary" }
        profile_token: { type: string }
    PreferencesInput:
      type: object
      additionalProperties: false
      properties:
        household_size: { type: integer }
        meals_per_week: { type: integer }
        dietary_preferences: { type: array, items: { type: string } }
        meal_interests: { type: array, items: { type: string } }
        cooking_frequency: { type: string }
        delivery_area: { type: string }
        packaging_preference: { type: string }
        household_type: { type: string }
        fitness_goal: { type: string }
        usage: { type: string }
    EventBatch:
      type: object
      required: [anonymous_id, session_id, events]
      additionalProperties: false
      properties:
        anonymous_id: { type: string }
        session_id: { type: string }
        events:
          type: array
          maxItems: 20
          items:
            type: object
            required: [type]
            properties:
              type: { type: string }
              metadata:
                type: object
                additionalProperties:
                  oneOf: [{ type: string }, { type: number }, { type: boolean }]

    # ---- accounts
    RegisterInput:
      type: object
      required: [email, password, first_name, last_name, accept_terms]
      additionalProperties: false
      properties:
        email: { type: string, maxLength: 254 }
        password: { type: string, minLength: 12, description: "12 or more characters; at most 256 bytes." }
        first_name: { type: string, maxLength: 80 }
        last_name: { type: string, maxLength: 80 }
        accept_terms: { type: boolean }
    Customer:
      type: object
      required: [id, email, first_name, last_name, email_verified]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        email_verified: { type: boolean }
    SessionInfo:
      type: object
      required: [id, current, client, user_agent, created_at, last_seen_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        current: { type: boolean }
        client: { type: string, enum: [web, mobile] }
        user_agent: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    MFAState:
      type: string
      enum: [verified, challenge, enrolment_required, not_enrolled, not_applicable]
      description: |
        verified: a code was presented in this session. challenge: present a code.
        enrolment_required: set up an authenticator first. not_enrolled: MFA not
        required here (local development) and not set up.
    AdminPrincipal:
      type: object
      required: [id, email, name, role, roles, permissions, mfa]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { type: string, description: "The most senior staff role, for display. Authorise with permissions." }
        roles: { type: array, items: { type: string } }
        permissions:
          type: array
          items:
            type: string
            enum: [admin.access, analytics.view, leads.read, leads.update, leads.export, leads.erase, users.read, users.manage, catalog.read, catalog.manage, catalog.publish, nutrition.verify, plans.manage, menus.manage, menus.publish, subscriptions.read, orders.read, payments.read, payments.refund, promotions.manage, customers.read, customers.sensitive, customers.export, leads.manage, cases.read, cases.manage, campaigns.manage, subscriptions.manage, reports.read, audit.read, settings.manage, ingredients.read, ingredients.manage, recipes.read, recipes.create, recipes.edit, recipes.submit, recipes.review, recipes.approve, recipes.publish, nutrition.read, nutrition.review, nutrition.approve, chefs.manage, production.read, production.plan, production.approve, production.execute, production.configure, quality.read, quality.inspect, quality.release_hold, packaging.manage, waste.record, production_reports.read, suppliers.read, suppliers.manage, suppliers.approve, supplier_products.read, supplier_products.manage, procurement.read, procurement.plan, procurement.approve, procurement.configure, purchase_orders.read, purchase_orders.create, purchase_orders.approve, purchase_orders.approve_above_limit, purchase_orders.issue, receiving.read, receiving.manage, receiving.inspect, inventory.read, inventory.reserve, inventory.issue, inventory.adjust, inventory.count, inventory.configure, traceability.read, supplier_reports.read, fulfillment.read, fulfillment.verify, fulfillment.release, delivery.read, delivery.read_assigned, delivery.plan, delivery.assign, delivery.dispatch, delivery.update_status, delivery.reschedule, delivery.confirm, delivery.reconcile, delivery_partners.read, delivery_partners.manage, delivery_partners.approve, delivery_zones.read, delivery_zones.manage, delivery_proof.read, delivery_proof.create, delivery_exceptions.read, delivery_exceptions.manage, delivery_reports.read, delivery_settings.manage, analytics_executive.read, analytics_revenue.read, analytics_customers.read, analytics_production.read, analytics_procurement.read, analytics_inventory.read, analytics_delivery.read, analytics.export, automation.read, automation.manage, automation.execute, automation.approve, forecasting.read, forecasting.run, forecasting.configure, launch.read, launch.signoff, payment_providers.read, payment_providers.manage, payment_providers.activate, support_chat.read, support_chat.reply, support_chat.assign, support_chat.transfer, support_chat.resolve, support_chat.internal_notes, support_chat.manage, support_chat.analytics, help_centre.edit, help_centre.publish, finance_expenses.read, finance_expenses.manage, finance_expenses.approve, intelligence.read, intelligence.ask, intelligence_executive.read, intelligence_financial.read, intelligence_customer.read, intelligence_operational.read, intelligence_scenario.run, intelligence_recommendation.review, intelligence.configure, intelligence.export]
        mfa: { $ref: "#/components/schemas/MFAState" }

    # ---- admin
    Bucket:
      type: object
      required: [label, count]
      properties:
        label: { type: string }
        count: { type: integer }
    Overview:
      type: object
      required: [total_leads, verified_leads, pending_leads, unsubscribed_leads, referral_conversions, referred_signups, profiles_completed, range_days, signups_by_day, sources, dietary, household_sizes, packaging, locations]
      properties:
        total_leads: { type: integer }
        verified_leads: { type: integer }
        pending_leads: { type: integer }
        unsubscribed_leads: { type: integer }
        referral_conversions: { type: integer }
        referred_signups: { type: integer }
        profiles_completed: { type: integer }
        range_days: { type: integer }
        signups_by_day:
          type: array
          items:
            type: object
            required: [date, count]
            properties:
              date: { type: string, format: date }
              count: { type: integer }
        sources: { type: array, items: { $ref: "#/components/schemas/Bucket" } }
        dietary: { type: array, items: { $ref: "#/components/schemas/Bucket" } }
        household_sizes: { type: array, items: { $ref: "#/components/schemas/Bucket" } }
        packaging: { type: array, items: { $ref: "#/components/schemas/Bucket" } }
        locations: { type: array, items: { $ref: "#/components/schemas/Bucket" } }
    LeadRow:
      type: object
      required: [id, first_name, last_name, email, status, location, source, household_size, referrals_converted, was_referred, created_at, stage, assigned_to]
      properties:
        id: { type: string, format: uuid }
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string }
        status: { $ref: "#/components/schemas/LeadStatus" }
        location: { type: string }
        source: { type: string }
        household_size: { type: [integer, "null"] }
        referrals_converted: { type: integer }
        was_referred: { type: boolean }
        created_at: { type: string, format: date-time }
        stage:
          type: string
          enum: [new, contacted, qualified, unqualified, converted, unsubscribed]
          description: CRM stage; converted and unsubscribed are derived from the lead's lifecycle.
        assigned_to: { type: [string, "null"], format: uuid }
    LeadPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/LeadRow" } }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
    ReferralEntry:
      type: object
      required: [lead_id, first_name, last_name, status, created_at, converted_at]
      properties:
        lead_id: { type: string, format: uuid }
        first_name: { type: string }
        last_name: { type: string }
        status: { type: string, enum: [pending, converted, flagged] }
        created_at: { type: string, format: date-time }
        converted_at: { type: [string, "null"], format: date-time }
    LeadDetail:
      type: object
      required: [id, first_name, last_name, email, phone, location, status, referral_code, email_verified_at, consent_at, consent_version, created_at, updated_at, preferences, attribution, referred_by, referrals, timeline, account]
      properties:
        id: { type: string, format: uuid }
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string }
        phone: { type: [string, "null"] }
        location: { type: string }
        status: { $ref: "#/components/schemas/LeadStatus" }
        referral_code: { type: string }
        email_verified_at: { type: [string, "null"], format: date-time }
        consent_at: { type: string, format: date-time }
        consent_version: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        preferences:
          oneOf:
            - type: "null"
            - type: object
              required: [household_size, meals_per_week, dietary_preferences, meal_interests, cooking_frequency, delivery_area, packaging_preference, metadata, updated_at]
              properties:
                household_size: { type: [integer, "null"] }
                meals_per_week: { type: [integer, "null"] }
                dietary_preferences: { type: array, items: { type: string } }
                meal_interests: { type: array, items: { type: string } }
                cooking_frequency: { type: [string, "null"] }
                delivery_area: { type: [string, "null"] }
                packaging_preference: { type: [string, "null"] }
                metadata: { type: object, additionalProperties: { type: string } }
                updated_at: { type: string, format: date-time }
        attribution:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/AttributionTouch"
              - type: object
                required: [touch, created_at]
                properties:
                  touch: { type: string, enum: [first, latest] }
                  created_at: { type: string, format: date-time }
        referred_by:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ReferralEntry"
        referrals: { type: array, items: { $ref: "#/components/schemas/ReferralEntry" } }
        timeline:
          type: array
          items:
            type: object
            required: [kind, type, metadata, created_at]
            properties:
              kind: { type: string, enum: [event, audit] }
              type: { type: string }
              metadata: { type: object, additionalProperties: true }
              created_at: { type: string, format: date-time }
        account:
          description: The customer account this lead became, once linked.
          oneOf:
            - type: "null"
            - type: object
              required: [customer_id, linked_at]
              properties:
                customer_id: { type: string, format: uuid }
                linked_at: { type: string, format: date-time }

    # ---- Sprint 2: account settings
    ChangePasswordInput:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 12 }
    EmailChangeInput:
      type: object
      required: [new_email, current_password]
      additionalProperties: false
      properties:
        new_email: { type: string, maxLength: 254 }
        current_password: { type: string }

    # ---- Sprint 2: the customer's own records
    Term:
      type: object
      required: [key, label]
      properties:
        key: { type: string }
        label: { type: string }
    DeliveryAvailability:
      type: string
      enum: [unknown, available, planned, unavailable]
      description: "unknown until delivery zones are configured. Never read as a promise of delivery."
    Profile:
      type: object
      required: [email, pending_email, first_name, last_name, email_verified, phone, contact_channel, language, delivery_country, delivery_region, delivery_availability, waitlist_linked, member_since]
      properties:
        email: { type: string }
        pending_email: { type: [string, "null"], description: "The address an open change link would switch to." }
        first_name: { type: string }
        last_name: { type: string }
        email_verified: { type: boolean }
        phone: { type: [string, "null"] }
        contact_channel: { type: string, enum: [email, sms, whatsapp] }
        language: { type: string, enum: [en] }
        delivery_country: { type: [string, "null"] }
        delivery_region: { type: [string, "null"] }
        delivery_availability: { $ref: "#/components/schemas/DeliveryAvailability" }
        waitlist_linked: { type: boolean }
        member_since: { type: string, format: date-time }
    ProfileInput:
      type: object
      additionalProperties: false
      properties:
        first_name: { type: string, maxLength: 80 }
        last_name: { type: string, maxLength: 80 }
        phone: { type: string, maxLength: 20 }
        contact_channel: { type: string, enum: [email, sms, whatsapp] }
        language: { type: string, enum: [en] }
        delivery_country: { type: string }
        delivery_region: { type: string }
    Household:
      type: object
      required: [name, size, adults, children, source, updated_at]
      properties:
        name: { type: [string, "null"] }
        size: { type: integer, minimum: 1, maximum: 20 }
        adults: { type: [integer, "null"] }
        children: { type: [integer, "null"] }
        source: { type: string, enum: [customer, waitlist] }
        updated_at: { type: [string, "null"], format: date-time }
    HouseholdInput:
      type: object
      required: [size]
      additionalProperties: false
      properties:
        name: { type: [string, "null"], maxLength: 60 }
        size: { type: integer, minimum: 1, maximum: 20 }
        adults: { type: [integer, "null"], minimum: 1, maximum: 20 }
        children: { type: [integer, "null"], minimum: 0, maximum: 19 }
    Allergy:
      type: object
      required: [allergen, label, detail]
      properties:
        allergen: { type: string }
