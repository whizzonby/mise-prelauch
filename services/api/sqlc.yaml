# sqlc generates typed Go for the SQL in each module's queries.sql. The schema
# is read from the Goose migrations, so there is one source of truth.
#
# Regenerate after changing a query or a migration:
#   pnpm sqlc        (runs sqlc in Docker; no local install needed)
#
# Generated files are committed. CI regenerates and fails if they differ.
# Modules written before Sprint 1 use hand-written SQL and are not converted
# (ADR-002); new modules use sqlc.
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/identity/queries.sql
    gen:
      go:
        package: store
        out: internal/identity/store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: string
          - db_type: uuid
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
