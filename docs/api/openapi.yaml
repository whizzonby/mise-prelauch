  /api/v1/meals:
    get:
      tags: [catalog]
      operationId: listMeals
      description: "Published meals only. Filters combine with AND. exclude_allergens also drops meals whose allergens are not yet declared."
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { name: diet, in: query, description: "Comma-separated dietary keys; a meal must suit every one.", schema: { type: string } }
        - { name: max_minutes, in: query, description: Preparation plus cooking time, schema: { type: integer, minimum: 1, maximum: 480 } }
        - { name: protein, in: query, schema: { type: string } }
        - { name: chef, in: query, description: Chef slug, schema: { type: string } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: exclude_allergens, in: query, description: "Comma-separated allergen keys", schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, quickest, name], default: newest } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 48, default: 24 } }
      responses:
        "200":
          description: One page of meals.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/MealPage" }
