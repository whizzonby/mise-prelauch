      required: [answer, claims, tables, charts, assumptions, limitations, follow_ups]
      properties:
        answer: { type: string }
        claims:
          type: array
          items:
            type: object
            required: [text, ref, fact, value]
            properties:
              text: { type: string }
              ref: { type: string, description: "The evidence ref (E1, E2, ...) of the tool result the claim comes from." }
              fact: { type: string }
              value: { type: number, nullable: true }
        tables:
          type: array
          items:
            type: object
            required: [title, ref, columns, rows]
            properties:
              title: { type: string }
              ref: { type: string }
              columns: { type: array, items: { type: string } }
              rows: { type: array, items: { type: array, items: { type: string } } }
        charts:
          type: array
          items:
            type: object
            required: [type, title, table, label_column, value_column]
            properties:
              type: { type: string, enum: [bar, line] }
              title: { type: string }
              table: { type: integer, description: "Index into tables." }
              label_column: { type: integer }
              value_column: { type: integer }
        assumptions: { type: array, items: { type: string } }
        limitations: { type: array, items: { type: string } }
        follow_ups: { type: array, items: { type: string } }
    IntelligenceRun:
      type: object
      required: [id, kind, user_id, job, provider, model, prompt_version, question, from, to, status, output, tool_calls, evidence, limitations, validation, review_status, review_note, model_calls, input_tokens, output_tokens, cost_usd_micros, duration_ms, error, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [ask, briefing, meal_concepts] }
        user_id: { type: string, format: uuid, nullable: true }
        job: { type: string }
        provider: { type: string }
        model: { type: string }
        prompt_version: { type: string }
        question: { type: string }
        from: { type: string, format: date, nullable: true }
        to: { type: string, format: date, nullable: true }
        status: { type: string, enum: [completed, partial, unavailable, refused, failed] }
        output:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/IntelligenceAnswer"
        tool_calls:
          type: array
          items:
            type: object
            required: [ref, tool, args, ok]
            properties:
              ref: { type: string }
              tool: { type: string }
              args: { type: object, additionalProperties: true }
              ok: { type: boolean }
              error: { type: string }
        evidence: { type: array, items: { $ref: "#/components/schemas/IntelligenceEvidence" } }
        limitations: { type: array, items: { type: string } }
        validation:
          type: object
          required: [claims_checked, numbers_checked, unsupported, regenerated, removed]
          properties:
            claims_checked: { type: integer }
            numbers_checked: { type: integer }
            unsupported:
              type: array
              items:
                type: object
                required: [where, value, reason]
                properties:
                  where: { type: string }
                  value: { type: string }
                  reason: { type: string }
            regenerated: { type: boolean }
            removed: { type: integer }
        review_status: { type: string, enum: [unreviewed, reviewed, flagged] }
        review_note: { type: string }
        model_calls: { type: integer }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        cost_usd_micros: { type: integer, format: int64, nullable: true, description: "Estimated from the configured prices; the provider's invoice is authoritative." }
        duration_ms: { type: integer }
        error: { type: string }
        created_at: { type: string, format: date-time }
    ScenarioRequest:
      type: object
      required: [horizon_days]
      properties:
        horizon_days: { type: integer, enum: [30, 60, 90, 182, 365] }
        preset: { type: string, enum: [base, conservative, optimistic, custom] }
        observed_months: { type: integer, minimum: 1, maximum: 12 }
        values: { type: object, additionalProperties: { type: integer, format: int64, nullable: true }, description: "Entered assumptions by input key; they replace observed and preset values." }
        investments: { type: array, items: { $ref: "#/components/schemas/ScenarioInvestment" } }
        changes:
          type: array
          items:
            type: object
            required: [kind]
            properties:
              kind: { type: string, enum: [price_increase, customer_growth, churn_change, ingredient_cost, hire, kitchen_expansion, delivery_expansion, new_meal_kit, marketing, supplier_change] }
              params: { type: object, additionalProperties: { type: integer, format: int64 } }
              label: { type: string, maxLength: 100 }
    ScenarioInvestment:
      type: object
      required: [week, amount_minor, label]
      properties:
        week: { type: integer, minimum: 1 }
        amount_minor: { type: integer, format: int64 }
        label: { type: string }
    ScenarioObserved:
      type: object
      required: [from, to, months, values, notes, generated_at]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        months: { type: integer }
        values:
          type: array
          items:
            type: object
            required: [key, label, unit, value, basis, sources]
            properties:
              key: { type: string }
              label: { type: string }
              unit: { type: string }
              value: { type: integer, format: int64, nullable: true }
              basis: { type: string }
              sources: { type: array, items: { type: string } }
        notes: { type: array, items: { type: string } }
        generated_at: { type: string, format: date-time }
    ScenarioModel:
      type: object
      required: [observed, variables, horizons, change_kinds, presets, preset_note, engine_version]
      properties:
        observed: { $ref: "#/components/schemas/ScenarioObserved" }
        variables: { type: array, items: { type: object, additionalProperties: true } }
        horizons: { type: array, items: { type: integer } }
        change_kinds: { type: array, items: { type: object, required: [kind, params], properties: { kind: { type: string }, params: { type: array, items: { type: string } } } } }
        presets: { type: array, items: { type: string } }
        preset_note: { type: string }
        engine_version: { type: string }
    ScenarioInput:
      type: object
      required: [key, label, unit, value, source, basis]
      properties:
        key: { type: string }
        label: { type: string }
        unit: { type: string }
        value: { type: integer, format: int64, nullable: true }
        source: { type: string, description: "observed, preset, assumption or what_if; empty when missing." }
        basis: { type: string }
    ScenarioTotals:
      type: object
      properties:
        sales_minor: { type: integer, format: int64 }
        variable_costs_minor: { type: integer, format: int64 }
        contribution_minor: { type: integer, format: int64 }
        fixed_costs_minor: { type: integer, format: int64 }
        investments_minor: { type: integer, format: int64 }
        operating_result_minor: { type: integer, format: int64 }
        paid_kits: { type: integer, format: int64 }
        end_active_subscriptions: { type: integer, format: int64 }
        capacity_breach_weeks: { type: integer }
    ScenarioBreakEven:
      type: object
      properties:
        subscriptions: { type: integer, format: int64, nullable: true }
        contribution_per_subscription_week_minor: { type: string }
        fixed_costs_per_week_minor: { type: string }
        formula: { type: string }
        note: { type: string }
    ScenarioCash:
      type: object
      properties:
        peak_need_minor: { type: integer, format: int64 }
        lowest_cash_minor: { type: integer, format: int64, nullable: true }
        first_negative_week: { type: integer, nullable: true }
        ending_cash_minor: { type: integer, format: int64, nullable: true }
        note: { type: string }
        opening_available: { type: boolean }
    ScenarioOutput:
      type: object
      required: [engine_version, input_hash, complete, missing, weeks, totals, break_even, cash, limitations, statement]
      properties:
        engine_version: { type: string }
        input_hash: { type: string }
        complete: { type: boolean }
        missing: { type: array, items: { type: string } }
        weeks: { type: array, items: { type: object, additionalProperties: true } }
        totals: { nullable: true, allOf: [{ $ref: "#/components/schemas/ScenarioTotals" }] }
        break_even: { nullable: true, allOf: [{ $ref: "#/components/schemas/ScenarioBreakEven" }] }
        cash: { $ref: "#/components/schemas/ScenarioCash" }
        limitations: { type: array, items: { type: string } }
        statement: { type: string }
    ScenarioProjection:
      type: object
      required: [preset, horizon_days, inputs, investments, changes, assumptions, preset_note, observed, output]
      properties:
        preset: { type: string }
        horizon_days: { type: integer }
        inputs: { type: array, items: { $ref: "#/components/schemas/ScenarioInput" } }
        investments: { type: array, items: { $ref: "#/components/schemas/ScenarioInvestment" } }
        changes: { type: array, items: { type: object, additionalProperties: true } }
        assumptions: { type: array, items: { type: string } }
        preset_note: { type: string }
        observed: { $ref: "#/components/schemas/ScenarioObserved" }
        output: { $ref: "#/components/schemas/ScenarioOutput" }
    ScenarioVersion:
      type: object
      required: [id, scenario_id, scenario_name, version, horizon_days, engine_version, input_hash, note, projection, created, created_at]
      properties:
        id: { type: string, format: uuid }
        scenario_id: { type: string, format: uuid }
        scenario_name: { type: string }
        version: { type: integer }
        horizon_days: { type: integer }
        engine_version: { type: string }
        input_hash: { type: string }
        note: { type: string }
        projection: { $ref: "#/components/schemas/ScenarioProjection" }
        created: { type: boolean }
        created_at: { type: string, format: date-time }
    Scenario:
      type: object
      required: [id, name, description, preset, archived, created_at, versions]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        preset: { type: string }
        archived: { type: boolean }
        created_at: { type: string, format: date-time }
        versions: { type: array, items: { $ref: "#/components/schemas/ScenarioVersion" } }
    ScenarioSummary:
      type: object
      required: [id, name, description, preset, archived, versions, latest_version_id, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        preset: { type: string }
        archived: { type: boolean }
        versions: { type: integer }
        latest_version_id: { type: string }
        created_at: { type: string, format: date-time }
    ScenarioComparison:
      type: object
      required: [columns, note, statement]
      properties:
        columns:
          type: array
          items:
            type: object
            required: [version_id, scenario, version, preset, horizon_days, complete, totals, break_even, cash, inputs, assumptions]
            properties:
              version_id: { type: string, format: uuid }
              scenario: { type: string }
              version: { type: integer }
              preset: { type: string }
              horizon_days: { type: integer }
              complete: { type: boolean }
              totals: { nullable: true, allOf: [{ $ref: "#/components/schemas/ScenarioTotals" }] }
              break_even: { nullable: true, allOf: [{ $ref: "#/components/schemas/ScenarioBreakEven" }] }
              cash: { $ref: "#/components/schemas/ScenarioCash" }
              inputs: { type: array, items: { $ref: "#/components/schemas/ScenarioInput" } }
              assumptions: { type: array, items: { type: string } }
        note: { type: string }
        statement: { type: string }
    IntelligenceSaveFrom:
      type: object
      required: [key]
      properties:
        key: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
    MealIntelligence:
      type: object
      required: [from, to, weeks_in_period, meals, rules, limitations]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        weeks_in_period: { type: integer }
        meals:
          type: array
          items:
            type: object
            required: [meal_id, name, slug, category, demo, weeks_on_menu, kits_ordered, kits_per_week_on_menu, customers, repeat_customers, repeat_share, waste_records, cost_per_serving_minor, cost_complete, cost_note, prep_minutes, labels]
            properties:
              meal_id: { type: string, format: uuid }
              name: { type: string }
              slug: { type: string }
              category: { type: string }
              demo: { type: boolean }
              weeks_on_menu: { type: integer }
              kits_ordered: { type: integer }
              kits_per_week_on_menu: { type: number, nullable: true }
              customers: { type: integer }
              repeat_customers: { type: integer }
              repeat_share: { type: number, nullable: true }
              waste_records: { type: integer }
              cost_per_serving_minor: { type: integer, format: int64, nullable: true }
              cost_complete: { type: boolean }
              cost_note: { type: string }
              prep_minutes: { type: integer }
              labels: { type: array, items: { type: string, enum: [high_demand, availability_constrained, underperforming, high_cost] } }
        rules: { type: array, items: { type: string } }
        limitations: { type: array, items: { type: string } }
    IntelligenceRiskThreshold:
      type: object
      required: [key, enabled, warn, critical, direction, unit, is_default, note, updated_at]
      properties:
        key: { type: string }
        enabled: { type: boolean }
        warn: { type: number }
        critical: { type: number }
        direction: { type: string, enum: [above, below] }
        unit: { type: string }
        is_default: { type: boolean }
        note: { type: string }
        updated_at: { type: string, format: date-time }
    IntelligenceRisk:
      type: object
      required: [key, title, domain, status, severity, measure, value, threshold, metrics, from, to, previous_from, previous_to, explanation, review_action, review_href, freshness, limitations]
      properties:
        key: { type: string }
        title: { type: string }
        domain: { type: string }
        status: { type: string, enum: [triggered, clear, not_evaluable] }
        severity: { type: string, enum: [none, watch, high] }
        measure: { type: string }
        value: { type: number, nullable: true }
        threshold: { $ref: "#/components/schemas/IntelligenceRiskThreshold" }
        metrics:
          type: array
          items:
            type: object
            required: [id, label, current, previous, unit]
            properties:
              id: { type: string }
              label: { type: string }
              current: { type: number, nullable: true }
              previous: { type: number, nullable: true }
              unit: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        previous_from: { type: string, format: date }
        previous_to: { type: string, format: date }
        explanation: { type: string }
        review_action: { type: string }
        review_href: { type: string }
        freshness: { type: string, format: date-time }
        limitations: { type: array, items: { type: string } }
    IntelligenceOpportunity:
      type: object
      required: [key, title, domain, basis, summary, evidence, review, review_href, caution, generated_at]
      properties:
        key: { type: string }
        title: { type: string }
        domain: { type: string }
        basis: { type: string, enum: [observed, ai_hypothesis, business_proposal, validated] }
        summary: { type: string }
        evidence: { type: object, additionalProperties: { type: string } }
        review: { type: string }
        review_href: { type: string }
        caution: { type: string }
        from: { type: string }
        to: { type: string }
        generated_at: { type: string, format: date-time }
    IntelligenceReviewEvent:
      type: object
      required: [action, from_status, to_status, note, actor, created_at]
      properties:
        action: { type: string }
        from_status: { type: string }
        to_status: { type: string }
        note: { type: string }
        actor: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
    IntelligenceRecommendation:
      type: object
      required: [id, kind, basis, domain, source_key, title, summary, evidence, review_href, status, assigned_to, run_id, created_at, updated_at, events]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [risk, opportunity, ai_suggestion, proposal] }
        basis: { type: string, enum: [observed, ai_hypothesis, business_proposal, validated] }
        domain: { type: string }
        source_key: { type: string }
        title: { type: string }
        summary: { type: string }
        evidence: { type: object, additionalProperties: true }
        review_href: { type: string }
        status: { type: string, enum: [open, saved, assigned, dismissed, done] }
        assigned_to: { type: string, format: uuid, nullable: true }
        run_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        events: { type: array, items: { $ref: "#/components/schemas/IntelligenceReviewEvent" } }
    IntelligenceMealProposalIngredient:
      type: object
      required: [name, quantity, note]
      properties:
        name: { type: string, maxLength: 120 }
        quantity: { type: string, maxLength: 60 }
        note: { type: string, maxLength: 300 }
        ingredient_id: { type: string, format: uuid, nullable: true }
    IntelligenceMealProposalInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        target_audience: { type: string, maxLength: 500 }
        ingredients: { type: array, maxItems: 40, items: { $ref: "#/components/schemas/IntelligenceMealProposalIngredient" } }
        complexity: { type: string, enum: [low, medium, high, unknown] }
    IntelligenceMealProposal:
      type: object
      required: [id, origin, name, description, target_audience, ingredients, complexity, availability_notes, limitations, evidence, status, recipe_id, recipe_status, run_id, required_approvals, estimated_cost_minor, cost_note, created_at, events]
      properties:
        id: { type: string, format: uuid }
        origin: { type: string, enum: [ai, manual] }
        name: { type: string }
        description: { type: string }
        target_audience: { type: string }
        ingredients: { type: array, items: { $ref: "#/components/schemas/IntelligenceMealProposalIngredient" } }
        complexity: { type: string }
        availability_notes: { type: array, items: { type: string } }
        limitations: { type: array, items: { type: string } }
        evidence: { type: object, additionalProperties: true }
        status: { type: string, enum: [proposed, in_review, approved_for_development, in_development, closed, rejected] }
        recipe_id: { type: string, format: uuid, nullable: true }
        recipe_status: { type: string, nullable: true }
        run_id: { type: string, format: uuid, nullable: true }
        required_approvals: { type: array, items: { type: string } }
        estimated_cost_minor: { type: integer, format: int64, nullable: true }
        cost_note: { type: string }
        created_at: { type: string, format: date-time }
        events: { type: array, items: { $ref: "#/components/schemas/IntelligenceReviewEvent" } }
