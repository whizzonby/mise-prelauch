# Sized for a low-memory development PC (docs/mobile/MOBILE_ARCHITECTURE.md §
# "Building on this machine"). Flutter's template asks for an 8 GB heap, which
# this machine cannot spare. One worker, no parallel builds, no daemon left
# running after the build.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx768m
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
