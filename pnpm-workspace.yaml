packages:
  - apps/*
  - packages/*
  - e2e

# Security floors for packages we only get indirectly (through next, postcss and
# eslint-plugin-react-hooks). Remove an entry once its parent requires the
# patched version itself.
#   source-map-js >=1.2.2: GHSA-68fv-2mgg-jv7q (event-loop denial of service)
#   zod >=4.6.6: memory exhaustion on oversized constrained collections
overrides:
  source-map-js: ">=1.2.2"
  zod@4: ">=4.6.7 <5"
  # Test tooling only (jsdom -> undici); never shipped.
  undici@8: ">=8.12.2 <9"
  # Test tooling only (vitest -> vite): GHSA-9jrq-w75r-8gcw and related
  # dev-server advisories, fixed in 8.3.3.
  vite: "^8.3.3"

# Packages allowed to run install scripts (they download or build native binaries).
allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: true
  unrs-resolver: true
