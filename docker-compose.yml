# Local development. `docker compose up` runs everything;
# `docker compose up -d postgres mailpit` runs only the backing services so the
# apps can run on the host with hot reload.
#
# Mise uses its own port block so it does not collide with other projects:
#   marketing 3100, admin 3101, api 8090, postgres 5460, mailpit 1026 / 8026
name: mise

x-api-env: &api-env
  MISE_ENV: local
  HTTP_ADDR: ":8080"
  DATABASE_URL: postgres://mise:mise@postgres:5432/mise?sslmode=disable
  TOKEN_SIGNING_KEY: local-development-signing-key-not-for-production
  PUBLIC_SITE_URL: http://localhost:3100
  CORS_ORIGINS: http://localhost:3100
  EMAIL_VERIFICATION_REQUIRED: "true"
  MAIL_DRIVER: smtp
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  MAIL_FROM: Mise <hello@mise.local>
  LOG_LEVEL: debug

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mise
      POSTGRES_PASSWORD: mise
      POSTGRES_DB: mise
    ports:
      - "5460:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mise -d mise"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Catches every email the worker sends. Inbox at http://localhost:8026
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1026:1025"
      - "8026:8025"

  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    command: ["/app/misectl", "migrate", "up"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    command: ["/app/api"]
    environment: *api-env
    ports:
      - "8090:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    command: ["/app/worker"]
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  marketing:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        APP: marketing
        NEXT_PUBLIC_API_URL: http://localhost:8090
        NEXT_PUBLIC_SITE_URL: http://localhost:3100
    environment:
      PORT: "3100"
      API_INTERNAL_URL: http://api:8080
    ports:
      - "3100:3100"
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        APP: admin
    environment:
      PORT: "3101"
      API_INTERNAL_URL: http://api:8080
      ADMIN_COOKIE_SECURE: "false"
    ports:
      - "3101:3101"
    depends_on:
      - api

volumes:
  postgres-data:
