# Apache virtual hosts for the Mise review server (docs/launch/REVIEW_SERVER.md).
#
# Replace example.com with the Mise domain (one command in the guide), install, then run certbot:
# certbot copies each host to an HTTPS version and redirects http to https.
#
# Needs: mod_proxy, mod_proxy_http, mod_proxy_wstunnel, mod_headers, mod_rewrite, mod_setenvif.
# Mise listens only on 127.0.0.1 (ports 3100-3102 and 8025); Apache is the only thing facing the internet.
# The other sites on this server are not affected: each block below answers only its own hostnames.

# Shared settings, repeated in each host so certbot copies them.
# - ProxyPreserveHost: the apps build links and cookies from the real hostname.
# - X-Forwarded-Proto: the apps know the visitor used https.
# - flushpackets=on and no compression on /api/chat: live chat (Server-Sent Events) must reach the
#   browser as it happens, not when a buffer fills.
# - X-Robots-Tag: a review server must not appear in search engines.

<VirtualHost *:80>
    ServerName example.com
    ServerAlias www.example.com

    ProxyPreserveHost On
    ProxyTimeout 120
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    Header always set X-Robots-Tag "noindex, nofollow"
    SetEnvIf Request_URI "^/api/chat/" no-gzip dont-vary
    ProxyPass        / http://127.0.0.1:3100/ flushpackets=on
    ProxyPassReverse / http://127.0.0.1:3100/

    ErrorLog ${APACHE_LOG_DIR}/mise-site-error.log
    CustomLog ${APACHE_LOG_DIR}/mise-site-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName app.example.com

    ProxyPreserveHost On
    ProxyTimeout 120
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    Header always set X-Robots-Tag "noindex, nofollow"
    SetEnvIf Request_URI "^/api/chat/" no-gzip dont-vary
    ProxyPass        / http://127.0.0.1:3102/ flushpackets=on
    ProxyPassReverse / http://127.0.0.1:3102/

    ErrorLog ${APACHE_LOG_DIR}/mise-app-error.log
    CustomLog ${APACHE_LOG_DIR}/mise-app-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName admin.example.com

    ProxyPreserveHost On
    ProxyTimeout 120
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    Header always set X-Robots-Tag "noindex, nofollow"
    SetEnvIf Request_URI "^/api/chat/" no-gzip dont-vary
    ProxyPass        / http://127.0.0.1:3101/ flushpackets=on
    ProxyPassReverse / http://127.0.0.1:3101/

    ErrorLog ${APACHE_LOG_DIR}/mise-admin-error.log
    CustomLog ${APACHE_LOG_DIR}/mise-admin-access.log combined
</VirtualHost>

# The email inbox (Mailpit). It asks for its own login (MAILPIT_USER / MAILPIT_PASSWORD).
<VirtualHost *:80>
    ServerName mail.example.com

    ProxyPreserveHost On
    Header always set X-Robots-Tag "noindex, nofollow"
    # Mailpit updates the inbox live over a WebSocket.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/(.*) ws://127.0.0.1:8025/$1 [P,L]
    ProxyPass        / http://127.0.0.1:8025/
    ProxyPassReverse / http://127.0.0.1:8025/

    ErrorLog ${APACHE_LOG_DIR}/mise-mail-error.log
    CustomLog ${APACHE_LOG_DIR}/mise-mail-access.log combined
</VirtualHost>
